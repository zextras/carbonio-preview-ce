sonar.projectKey=com.zextras.carbonio.preview:carbonio-preview-ce
sonar.projectName=carbonio-preview-ce
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,sdk/src/test/java/**
sonar.exclusions=**/*_test.go,sdk/src/test/**,sdk/target/**,tools/**,**/testdata/**,**/vendor/**,.ci/**,docs/**,go-tests.xml,.m2-repo/**,**/.flattened-pom.xml
