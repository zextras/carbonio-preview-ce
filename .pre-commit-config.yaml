repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-added-large-files
        args: [--maxkb=2048]
    -   id: check-json
    -   id: check-merge-conflict
    -   id: check-shebang-scripts-are-executable
    -   id: check-toml
    -   id: check-xml
    -   id: check-yaml
        args: [--allow-multiple-documents]
    -   id: end-of-file-fixer
        # A formatting hook rewriting a generated file makes CI red forever (generator
        # writes X -> hook rewrites X -> dev commits that -> CI regenerates X -> diff -> FAIL).
        # db/migration/ is excluded for a different reason: dt3_flywayGuard hashes released
        # migrations against the last v* tag and hard-fails on any byte difference. golang-migrate
        # itself only tracks version/dirty in schema_migrations (no content checksum), so this
        # isn't a validation-break risk like Flyway -- but the CI guard now treats these files as
        # immutable, so a local trailing-newline fix would still turn the build red for nothing.
        # Not excluded from `reuse` lint: licence checks must still cover generated files.
        exclude: &generated-files "^THIRDPARTIES$|^docs/|^package/PKGBUILD$|^db/migration/"
    -   id: trailing-whitespace
        # Two trailing spaces are a hard line break in Markdown; stripping them changes rendering.
        args: [--markdown-linebreak-ext=md]
        exclude: *generated-files

-   repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
    -   id: shellcheck
        # Vendored verbatim from jenkins-lib-common; fix warnings upstream, then re-vendor.
        exclude: "^\\.ci/checksum-verify\\.sh$"

-   repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
    -   id: conventional-pre-commit
        stages: [commit-msg]
        args: []

-   repo: local
    hooks:
    -   id: reuse-download-licenses
        name: reuse-download-licenses
        description: "Fetches missing SPDX licence texts into LICENSES/; `reuse lint` below never autofixes and hard-fails without them."
        entry: reuse
        args: [download, --all]
        language: python
        # Keep in sync with the `reuse` hook's rev below (v6.2.0) or the two silently drift.
        additional_dependencies: ["reuse==6.2.0"]
        pass_filenames: false
        always_run: true

-   repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
        - id: reuse

-   repo: local
    hooks:
    -   id: comment-check
        name: comment-check
        description: "Warns on long non-documentation comments. Never blocks — it always exits 0."
        # The trailing -- is required: go run treats further .go arguments as extra sources.
        entry: go run .ci/comment-check.go --
        language: system
        types: [go]
        verbose: true

    -   id: gofmt
        name: gofmt
        description: "Canonical Go formatting; ships with the toolchain, so there is no version to pin or drift."
        entry: gofmt -l -w
        language: system
        types: [go]

-   repo: local
    hooks:
    # Generated-file hooks (see README.md): CI is verify-only, so generation happens here at commit time.
    # On "files were modified by this hook": `git add -u` the changed paths and commit again.
    -   id: thirdparties-go
        name: thirdparties-go (regenerate THIRDPARTIES)
        description: "Regenerates THIRDPARTIES with CI's own generator; must match byte-for-byte or the diff check fails."
        entry: bash .ci/thirdparties/thirdparties-go.sh THIRDPARTIES
        language: system
        pass_filenames: false
        always_run: true

    -   id: go-generate
        name: go generate ./... (docs + OpenAPI spec)
        description: "Regenerates docs/ (configs.md + OpenAPI spec); CGO_ENABLED=0 must match CI or unrelated docs go red."
        # docs/ must match the Jenkinsfile's goGenerate.paths; keep the two lists in sync.
        entry: env CGO_ENABLED=0 go generate ./...
        language: system
        pass_filenames: false
        always_run: true

    -   id: checksum-verify-pkgbuild
        name: checksum-verify-pkgbuild
        description: "Verifies and autofixes package/PKGBUILD sha256sums; SKIP entries for remote/versioned sources stay untouched."
        entry: bash .ci/checksum-verify.sh package/PKGBUILD true
        language: system
        pass_filenames: false
        files: ^package/
