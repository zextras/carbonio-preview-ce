            type: boolean
        - description: File owner ID for Advanced storage routing
          in: header
          name: fileownerid
          schema:
            description: File owner ID for Advanced storage routing
            type: string
      responses:
        "200":
          content:
            image/gif:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
            image/jpeg:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
            image/png:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
          description: Successful Response — binary image data
          headers:
            Content-Type:
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Internal Server Error
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Bad Gateway
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Service Unavailable
      summary: Get Image Preview
      tags:
        - image
