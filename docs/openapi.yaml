components:
  schemas:
    FastAPIError:
      additionalProperties: false
      type: object
    FormFile:
      additionalProperties: false
      properties:
        ContentType:
          type: string
        Filename:
          type: string
        IsSet:
          type: boolean
        Size:
          format: int64
          type: integer
      required:
        - ContentType
        - IsSet
        - Size
        - Filename
      type: object
    HealthDependency:
      additionalProperties: false
      properties:
        live:
          type: boolean
        name:
          type: string
        ready:
          type: boolean
        type:
          type: string
      required:
        - name
        - ready
        - live
        - type
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        dependencies:
          items:
            $ref: "#/components/schemas/HealthDependency"
          nullable: true
          type: array
        ready:
          type: boolean
      required:
        - ready
        - dependencies
      type: object
info:
  description: Preview service.
  title: preview
  version: latest
openapi: 3.0.3
paths:
  /health/:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Error
      summary: Health Summary
      tags:
        - health
  /health/live/:
    get:
      operationId: getHealthLive
      responses:
        "200":
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Error
      summary: Liveness Probe
      tags:
        - health
  /health/ready/:
    get:
      operationId: getHealthReady
      responses:
        "200":
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Error
      summary: Readiness Probe
      tags:
        - health
  /preview:
    post:
      description: "Same as getPreview for the uploaded file: passthrough or conversion, never stored or cached, storages and the database are never touched."
      operationId: postPreview
      parameters:
        - description: MIME type of the uploaded file
          explode: false
          in: query
          name: mime
          required: true
          schema:
            description: MIME type of the uploaded file
            maxLength: 255
            type: string
        - description: Language tag for office conversions
          explode: false
          in: query
          name: lang
          schema:
            default: en-US
            description: Language tag for office conversions
            maxLength: 35
            pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: application/octet-stream
            schema:
              properties:
                file:
                  description: Source file
                  format: binary
                  type: string
                  x-contentEncoding: binary
                  x-contentMediaType: application/octet-stream
              required:
                - file
              type: object
      responses:
        "200":
          content:
            application/pdf:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
            image/*:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
            video/*:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
          description: Successful Response — the file itself (images, PDF, video) or its conversion to JPEG, PNG or PDF
          headers:
            Content-Length:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Bad Request
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Internal Server Error
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Bad Gateway
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Service Unavailable
      summary: Post Preview
      tags:
        - preview
  /preview/{id}/{version}:
    get:
      description: Serves the preview of a file version synchronously, never stored or cached. Browser-native images (JPEG, PNG, GIF, WebP, AVIF, BMP), PDF and video are streamed from storages unchanged with the caller's MIME type as Content-Type. TIFF, HEIC/HEIF and SVG are converted to JPEG (PNG when transparency is used) at full resolution. Office documents are converted whole to PDF (400 when document.enable-preview is off). 415 for unsupported formats.
      operationId: getPreview
      parameters:
        - description: UUID of the file (UUID1-UUID4)
          in: path
          name: id
          required: true
          schema:
            description: UUID of the file (UUID1-UUID4)
            format: uuid
            type: string
        - description: Version of the file (non-negative integer)
          in: path
          name: version
          required: true
          schema:
            description: Version of the file (non-negative integer)
            format: int64
            minimum: 0
            type: integer
        - description: Service that owns the resource
          explode: false
          in: query
          name: service_type
          required: true
          schema:
            description: Service that owns the resource
            enum:
              - files
              - chats
            type: string
        - description: MIME type of the file as recorded by the caller
          explode: false
          in: query
          name: mime
          required: true
          schema:
            description: MIME type of the file as recorded by the caller
            maxLength: 255
            type: string
        - description: Language tag for office conversions
          explode: false
          in: query
          name: lang
          schema:
            default: en-US
            description: Language tag for office conversions
            maxLength: 35
            pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
            type: string
        - description: File owner ID for Advanced storage routing
          in: header
          name: fileownerid
          schema:
            description: File owner ID for Advanced storage routing
            type: string
      responses:
        "200":
          content:
            application/pdf:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
            image/*:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
            video/*:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
          description: Successful Response — the file itself (images, PDF, video) or its conversion to JPEG, PNG or PDF
          headers:
            Content-Length:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Not Found
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Internal Server Error
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Bad Gateway
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Service Unavailable
      summary: Get Preview
      tags:
        - preview
  /thumbnail/{id}:
    delete:
      description: "Deletes every stored thumbnail (all versions, both sizes) of a file: the blobs and the rows. Idempotent: deleting a file without thumbnails returns 204. When the thumbnail database is unavailable this is a no-op that still returns 204 (safe for fire-and-forget callers); 424 is returned only on a non-connection database error."
      operationId: deleteThumbnails
      parameters:
        - description: UUID of the file whose thumbnails (all versions, both sizes) are deleted
          in: path
          name: id
          required: true
          schema:
            description: UUID of the file whose thumbnails (all versions, both sizes) are deleted
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Unprocessable Entity
        "424":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Failed Dependency
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Internal Server Error
      summary: Delete Thumbnails
      tags:
        - thumbnail
  /thumbnail/{id}/{version}/{size}:
    get:
      description: "Serves the thumbnail of a file version, stored per file, version and size (s = 320 px, m = 1280 px long side, never upscaled), always re-encoded: JPEG (PNG when alpha is used; Q50 for s, Q80 for m; metadata stripped; EXIF rotation applied) or, for animated GIFs, an animated GIF capped at 10 fps. Images and PDFs are generated synchronously. Video, office and animated GIF thumbnails are generated asynchronously: 202 with Retry-After while generating (an animated GIF answers with its static first frame as body), 415 for unsupported formats, 422 when generation permanently failed. Without a usable database nothing is stored and every thumbnail, asynchronous kinds included, is generated in the request and kept in memory only. A digest different from the stored one regenerates the thumbnail."
      operationId: getThumbnail
      parameters:
        - description: UUID of the file (UUID1-UUID4)
          in: path
          name: id
          required: true
          schema:
            description: UUID of the file (UUID1-UUID4)
            format: uuid
            type: string
        - description: Version of the file (non-negative integer)
          in: path
          name: version
          required: true
          schema:
            description: Version of the file (non-negative integer)
            format: int64
            minimum: 0
            type: integer
        - description: Thumbnail size
          in: path
          name: size
          required: true
          schema:
            description: Thumbnail size
            enum:
              - s
              - m
            type: string
        - description: Service that owns the resource
          explode: false
          in: query
          name: service_type
          required: true
          schema:
            description: Service that owns the resource
            enum:
              - files
              - chats
            type: string
        - description: MIME type of the file as recorded by the caller
          explode: false
          in: query
          name: mime
          required: true
          schema:
            description: MIME type of the file as recorded by the caller
            maxLength: 255
            type: string
        - description: Content digest of the version; a different digest regenerates the thumbnail
          explode: false
          in: query
          name: digest
          schema:
            description: Content digest of the version; a different digest regenerates the thumbnail
            maxLength: 128
            pattern: ^[A-Za-z0-9+/=_.:-]+$
            type: string
        - description: Language tag for office conversions
          explode: false
          in: query
          name: lang
          schema:
            default: en-US
            description: Language tag for office conversions
            maxLength: 35
            pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
            type: string
        - description: File owner ID for Advanced storage routing
          in: header
          name: fileownerid
          schema:
            description: File owner ID for Advanced storage routing
            type: string
      responses:
        "200":
          content:
            image/gif:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
            image/jpeg:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
            image/png:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
          description: Successful Response — the thumbnail rendition
          headers:
            Cache-Control:
              schema:
                type: string
            Content-Length:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Retry-After:
              schema:
                type: string
        "202":
          content:
            image/jpeg:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
            image/png:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
          description: The thumbnail is being generated; poll again after Retry-After seconds
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before polling again
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Not Found
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Unprocessable Entity
        "424":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Failed Dependency
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Internal Server Error
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Bad Gateway
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Service Unavailable
      summary: Get Thumbnail
      tags:
        - thumbnail
  /thumbnail/{size}:
    post:
      description: Generates the thumbnail of the uploaded file synchronously, for every supported MIME type. The result is never stored or cached and storages and the database are never touched.
      operationId: postThumbnail
      parameters:
        - description: Thumbnail size
          in: path
          name: size
          required: true
          schema:
            description: Thumbnail size
            enum:
              - s
              - m
            type: string
        - description: MIME type of the uploaded file
          explode: false
          in: query
          name: mime
          required: true
          schema:
            description: MIME type of the uploaded file
            maxLength: 255
            type: string
        - description: Language tag for office conversions
          explode: false
          in: query
          name: lang
          schema:
            default: en-US
            description: Language tag for office conversions
            maxLength: 35
            pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: application/octet-stream
            schema:
              properties:
                file:
                  description: Source file
                  format: binary
                  type: string
                  x-contentEncoding: binary
                  x-contentMediaType: application/octet-stream
              required:
                - file
              type: object
      responses:
        "200":
          content:
            image/gif:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
            image/jpeg:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
            image/png:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
          description: Successful Response — the thumbnail rendition
          headers:
            Cache-Control:
              schema:
                type: string
            Content-Length:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Retry-After:
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Bad Request
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Internal Server Error
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Bad Gateway
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Service Unavailable
      summary: Post Thumbnail
      tags:
        - thumbnail
