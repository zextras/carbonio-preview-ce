openapi: 3.0.2
info:
  title: preview
  description: |
    Preview service.

    You can preview the following type of files:

    * **images (png/jpeg/gif/svg)**
    * **pdf**
    * **documents (xls, xlsx, ods, ppt, pptx, odp, doc, docx, odt)**
    * **video (mp4, mkv, …) — thumbnail/preview of first frame**

    You will be able to:

    * **Preview images**.
    * **Generate smart thumbnails**.

    The main difference between thumbnail and preview functionality is that
    preview tends to be more faithful while thumbnail tends to elaborate on it,
    cropping it by default and rounding the image if asked.
    Preview should always output the file in its original format, while thumbnail
    will convert it to an image.
    There is no difference in quality between png and jpeg; the difference in
    quality can be achieved only by asking for a jpeg format and changing the
    quality parameter.
    Asking for a GIF output can only be done when the input file is a GIF,
    otherwise it will raise an error.
  version: latest

paths:
  # ────────────────────────────────────────────────────────────────────
  # IMAGE
  # ────────────────────────────────────────────────────────────────────
  '/preview/image/{id}/{version}/{area}/thumbnail/':
    get:
      tags:
        - image
      summary: Get Thumbnail
      description: |
        Creates and returns a thumbnail of the image fetched by id and version
        with the given size, quality, format and shape.
        It will automatically crop the picture.
        - **id**: UUID of the image
        - **version**: version of the image
        - **quality**: quality of the output image (the higher the slower)
        - **output_format**: format of the output image
        - **area**: width x height (e.g. 100x200); the first is width, the latter height
        - **shape**: Rounded and Rectangular are currently supported
        - **service_type**: Service that owns the resource
      operationId: get_thumbnail_preview_image__id___version___area__thumbnail__get
      parameters:
        - required: true
          schema:
            title: Id
            type: string
            format: uuid
          name: id
          in: path
        - required: true
          schema:
            title: Version
            type: integer
            minimum: 0
          name: version
          in: path
        - required: true
          schema:
            title: Area
            type: string
            pattern: '^[0-9]+x[0-9]+$'
          name: area
          in: path
        - required: true
          schema:
            $ref: '#/components/schemas/ServiceTypeEnum'
          name: service_type
          in: query
        - required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/ImageBorderShapeEnum'
            default: rectangular
          name: shape
          in: query
        - required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/ImageQualityEnum'
            default: medium
          name: quality
          in: query
        - required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/ImageTypeEnum'
            default: jpeg
          name: output_format
          in: query
      responses:
        '200':
          description: Successful Response — binary image data
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '400':
          description: Some values in the query were not correct.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPDetail'
        '404':
          description: Requested item was not found in the storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '502':
          description: Storage is currently unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPDetail'
        '503':
          description: PDF rendering temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPDetail'

