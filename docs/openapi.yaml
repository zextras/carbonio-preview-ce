components:
  schemas:
    FastAPIError:
      additionalProperties: false
      type: object
    FormFile:
      additionalProperties: false
      properties:
        ContentType:
          type: string
        Filename:
          type: string
        IsSet:
          type: boolean
        Size:
          format: int64
          type: integer
      required:
        - ContentType
        - IsSet
        - Size
        - Filename
      type: object
    GenerateVideoOutputBody:
      additionalProperties: false
      properties:
        preview_id:
          description: Storage node id of the stored first-frame image (echoes target)
          type: string
      required:
        - preview_id
      type: object
    HealthDependency:
      additionalProperties: false
      properties:
        live:
          type: boolean
        name:
          type: string
        ready:
          type: boolean
        type:
          type: string
      required:
        - name
        - ready
        - live
        - type
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        dependencies:
          items:
            $ref: "#/components/schemas/HealthDependency"
          nullable: true
          type: array
        ready:
          type: boolean
      required:
        - ready
        - dependencies
      type: object
info:
  description: Preview service.
  title: preview
  version: latest
openapi: 3.0.3
paths:
  /health/:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Error
      summary: Health Summary
      tags:
        - health
  /health/live/:
    get:
      operationId: getHealthLive
      responses:
        "200":
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Error
      summary: Liveness Probe
      tags:
        - health
  /health/ready/:
    get:
      operationId: getHealthReady
      responses:
        "200":
          description: OK
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Internal Server Error
      summary: Readiness Probe
      tags:
        - health
  /preview/document/:
    post:
      operationId: postDocumentPreview
      parameters:
        - description: First page (1-based, default 1)
          explode: false
          in: query
          name: first_page
          schema:
            default: 1
            description: First page (1-based, default 1)
            format: int64
            type: integer
        - description: Last page (0 = all, default 0)
          explode: false
          in: query
          name: last_page
          schema:
            default: 0
            description: Last page (0 = all, default 0)
            format: int64
            type: integer
        - description: Language tag for conversion
          explode: false
          in: query
          name: lang_tag
          schema:
            default: en-US
            description: Language tag for conversion
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: application/octet-stream
            schema:
              properties:
                file:
                  description: Document file to process
                  format: binary
                  type: string
                  x-contentEncoding: binary
                  x-contentMediaType: application/octet-stream
              required:
                - file
              type: object
      responses:
        "200":
          content:
            application/pdf:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
          description: Successful Response — PDF bytes
          headers:
            Content-Type:
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Internal Server Error
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Bad Gateway
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Service Unavailable
      summary: Post Document Preview
      tags:
        - document
  /preview/document/{area}/thumbnail/:
    post:
      operationId: postDocumentThumbnail
      parameters:
        - description: Width x height in pixels
          in: path
          name: area
          required: true
          schema:
            description: Width x height in pixels
            pattern: ^[0-9]+x[0-9]+$
            type: string
        - description: Output quality
          explode: false
          in: query
          name: quality
          schema:
            default: medium
            description: Output quality
            enum:
              - lowest
              - low
              - medium
              - high
              - highest
            type: string
        - description: Output image format
          explode: false
          in: query
          name: output_format
          schema:
            default: jpeg
            description: Output image format
            enum:
              - jpeg
              - png
              - gif
            type: string
        - description: Thumbnail border shape
          explode: false
          in: query
          name: shape
          schema:
            default: rectangular
            description: Thumbnail border shape
            enum:
              - rounded
              - rectangular
            type: string
        - description: Language tag for conversion
          explode: false
          in: query
          name: lang_tag
          schema:
            default: en-US
            description: Language tag for conversion
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: application/octet-stream
            schema:
              properties:
                file:
                  description: Document file to process
                  format: binary
                  type: string
                  x-contentEncoding: binary
                  x-contentMediaType: application/octet-stream
              required:
                - file
              type: object
      responses:
        "200":
          content:
            image/gif:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
            image/jpeg:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
            image/png:
              schema:
                format: binary
                type: string
                x-contentMediaType: application/octet-stream
          description: Successful Response — binary image data
          headers:
            Content-Type:
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Internal Server Error
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Bad Gateway
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastAPIError"
          description: Service Unavailable
      summary: Post Document Thumbnail
      tags:
        - document
