components:
  schemas:
    # ── file upload body (shared by all POST multipart endpoints) ──────
    FileUploadBody:
      title: FileUploadBody
      required:
        - file
      type: object
      properties:
        file:
          title: File
          type: string
          format: binary

    # ── enum types ─────────────────────────────────────────────────────
    ImageBorderShapeEnum:
      title: ImageBorderShapeEnum
      enum:
        - rounded
        - rectangular
      type: string
      description: |
        Class representing all the image border shape accepted values.

    ImageQualityEnum:
      title: ImageQualityEnum
      enum:
        - lowest
        - low
        - medium
        - high
        - highest
      type: string
      description: |
        Class representing all the image quality accepted values.

    ImageTypeEnum:
      title: ImageTypeEnum
      enum:
        - jpeg
        - png
        - gif
      type: string
      description: |
        Class representing all the image type accepted values.

    ServiceTypeEnum:
      title: ServiceTypeEnum
      enum:
        - files
        - chats
      type: string
      description: |
        Class representing all the service type accepted values.

    # ── error shapes ───────────────────────────────────────────────────
    HTTPDetail:
      title: HTTPDetail
      type: object
      properties:
        detail:
          title: Detail
          type: string

    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      title: ValidationError
      required:
        - loc
        - msg
        - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string

    # ── health response schema ─────────────────────────────────────────
    HealthDependency:
      title: HealthDependency
      type: object
      required:
        - name
        - ready
        - live
        - type
      properties:
        name:
          title: Name
          type: string
        ready:
          title: Ready
          type: boolean
        live:
          title: Live
          type: boolean
        type:
          title: Type
          type: string

    HealthResponse:
      title: HealthResponse
      type: object
      required:
        - ready
        - dependencies
      properties:
        ready:
          title: Ready
          type: boolean
        dependencies:
          title: Dependencies
          type: array
          items:
            $ref: '#/components/schemas/HealthDependency'
